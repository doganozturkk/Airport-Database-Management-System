services:

  postgres-db:
    container_name: postgres-pb
    image: postgres:18
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=superSecurePassword
      - POSTGRES_DB=my_database
    volumes:
      - ./postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

  pgadmin:
    container_name: pgadmin-pb
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@student.si
      PGADMIN_DEFAULT_PASSWORD: superSecurePassword
